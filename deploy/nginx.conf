worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Never log OAuth callback query strings or request bodies.
  log_format safe '$remote_addr $request_method $uri $status $request_time';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # The application's batch limit is 40 MiB plus multipart overhead.
  client_max_body_size 41m;
  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  keepalive_timeout 30s;
  # This cap applies to the local tunnel as a whole; application login throttles
  # remain account-specific. Configure edge per-client rate limits separately.
  limit_req_zone $server_name zone=login:1m rate=30r/m;
  limit_req_status 429;
  upstream bills { server web:3000; keepalive 32; }
  server {
    listen 8080 default_server;
    server_name bills.voltronix.ae;
    if ($host != bills.voltronix.ae) { return 444; }
    # nginx error messages can include the original request line (code/state).
    # Keep sanitized access status/timing, but discard callback error details.
    location ~ ^/api/integrations/oauth/[^/]+/callback/?$ {
      error_log /dev/null;
      proxy_pass http://bills;
      proxy_set_header Host bills.voltronix.ae;
      proxy_set_header X-Forwarded-Host bills.voltronix.ae;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
    location = /api/auth/login {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://bills;
      proxy_set_header Host bills.voltronix.ae;
      proxy_set_header X-Forwarded-Host bills.voltronix.ae;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
    location / {
      proxy_pass http://bills;
      proxy_set_header Host bills.voltronix.ae;
      proxy_set_header X-Forwarded-Host bills.voltronix.ae;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 120s;
    }
  }
}
